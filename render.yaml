services:
  - type: web
    name: quality-disposition-dashboard
    env: python
    # V66.1: web-host DR is complemented by an external PostgreSQL dump runner.
    plan: free
    # DR note: keep DR_REMOTE_ENABLED=true only after a private off-site bucket is configured and tested.

    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    # Answers instantly and touches no database, so a slow first-run schema
    # build or seed can never cause the deploy to be marked unhealthy.
    healthCheckPath: /readyz
    envVars:
      # Without this, Python buffers stdout and the startup log stays empty,
      # which makes a slow boot indistinguishable from a silent hang.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_LIMIT_MB
        value: "500"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DR_REMOTE_ENABLED
        value: "false"
      - key: DR_REMOTE_REQUIRED_FOR_MUTATIONS
        value: "true"
      - key: DR_S3_BUCKET
        sync: false
      - key: DR_S3_REGION
        value: "us-east-1"
      - key: DR_S3_ENDPOINT_URL
        sync: false
      - key: DR_S3_ACCESS_KEY_ID
        sync: false
      - key: DR_S3_SECRET_ACCESS_KEY
        sync: false
      - key: DR_S3_PREFIX
        value: "quality-disposition-dashboard/recovery/"
      - key: DR_S3_SSE
        value: ""
      # Optional client-side encryption key for off-site dumps (Fernet key).
      # Leave unset to upload unencrypted; see docs/DEPLOY.md Part 2, Step 2B.
      - key: DR_ENCRYPTION_KEY
        sync: false
      # Optional hardened S3 Object Lock; requires an Object-Lock-enabled,
      # versioned bucket. Keep 0 until that bucket is provisioned and tested.
      - key: DR_S3_OBJECT_LOCK_DAYS
        value: "0"
      - key: DR_S3_OBJECT_LOCK_MODE
        value: "COMPLIANCE"
      - key: DR_BACKUP_EXCLUDE_TABLES
        value: "sessions,login_attempts,sqlite_sequence"
      - key: BACKUP_SCHEDULE_HOURS
        value: "1"
      - key: BACKUP_CHECK_SECONDS
        value: "60"
      - key: BACKUP_KEEP
        value: "30"
      # Backup-failure alerts (see alerts.py). Leave unset to disable a channel.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ALERT_COOLDOWN_MINUTES
        value: "360"
