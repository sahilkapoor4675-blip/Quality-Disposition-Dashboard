name: DR - PostgreSQL off-site backup

on:
  schedule:
    # Runs every 12 hours, independent of Render being awake.
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client tools (v17, matches Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Install Python dependencies
        run: pip install boto3

      - name: Run PostgreSQL dump and off-site upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DR_S3_BUCKET: ${{ secrets.DR_S3_BUCKET }}
          DR_S3_ACCESS_KEY_ID: ${{ secrets.DR_S3_ACCESS_KEY_ID }}
          DR_S3_SECRET_ACCESS_KEY: ${{ secrets.DR_S3_SECRET_ACCESS_KEY }}
          DR_S3_REGION: ${{ secrets.DR_S3_REGION }}
          DR_S3_ENDPOINT_URL: ${{ secrets.DR_S3_ENDPOINT_URL }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          TS=$(date -u +%Y%m%d_%H%M%S)
          python3 dr_pg_backup.py dump \
            --output "postgres-${TS}.dump" \
            --remote-key "scheduled/postgres-${TS}.dump"
