name: DR - PostgreSQL off-site backup

on:
  schedule:
    # Runs every 12 hours, independent of Render being awake.
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: pip install boto3

      - name: Run PostgreSQL dump and off-site upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DR_S3_BUCKET: ${{ secrets.DR_S3_BUCKET }}
          DR_S3_ACCESS_KEY_ID: ${{ secrets.DR_S3_ACCESS_KEY_ID }}
          DR_S3_SECRET_ACCESS_KEY: ${{ secrets.DR_S3_SECRET_ACCESS_KEY }}
          DR_S3_REGION: ${{ secrets.DR_S3_REGION }}
          DR_S3_ENDPOINT_URL: ${{ secrets.DR_S3_ENDPOINT_URL }}
        run: |
          TS=$(date -u +%Y%m%d_%H%M%S)
          python3 dr_pg_backup.py dump \
            --output "postgres-${TS}.dump" \
            --remote-key "scheduled/postgres-${TS}.dump"
